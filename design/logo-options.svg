<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Each mark is drawn in a 64 x 64 box. Charcoal parts use currentColor so they flip on dark. -->
    <g id="m1">
      <path d="M32 58V30" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M32 32C32 18 22 10 8 10c0 14 10 22 24 22z" fill="#8fb8a6"/>
      <path d="M32 26c0-12 8-18 22-18 0 12-8 18-22 18z" fill="#e9a23b"/>
    </g>
    <g id="m2">
      <rect width="64" height="64" rx="17" fill="#2f6884"/>
      <path d="M32 51V31" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M32 33c0-10-7-15-17-15 0 10 7 15 17 15z" fill="#bfe0ec"/>
      <path d="M32 29c0-9 6-13 16-13 0 9-6 13-16 13z" fill="#fff"/>
    </g>
    <g id="m3">
      <path d="M48.9 19.9A22 22 0 1 0 54 34H36" stroke="#2f6884" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M47 18c0-10 6-15 16-15 0 10-6 15-16 15z" fill="#8fb8a6"/>
    </g>
    <g id="m4">
      <path d="M16 6h22l14 14v34a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z" fill="#fffdf8" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M38 6v14h14" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" fill="none"/>
      <path d="M32 50V36" stroke="#2a2d2f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M32 39c0-8-5-12-13-12 0 8 5 12 13 12z" fill="#8fb8a6"/>
      <path d="M32 35c0-7 5-10 12-10 0 7-5 10-12 10z" fill="#e9a23b"/>
    </g>
    <g id="m5">
      <circle cx="32" cy="32" r="30" fill="#b8e0f0" opacity=".55"/>
      <circle cx="32" cy="32" r="21" fill="#c4e6b8" opacity=".85"/>
      <circle cx="32" cy="32" r="12.5" fill="#2f6884"/>
      <path d="M32 39V31" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M32 33c0-5-3-7-8-7 0 5 3 7 8 7z" fill="#fff"/>
      <path d="M32 31c0-4 3-6 7-6 0 4-3 6-7 6z" fill="#fff"/>
    </g>
    <g id="m6">
      <circle cx="30" cy="40" r="17" stroke="currentColor" stroke-width="8" fill="none"/>
      <path d="M31 22c0-11 7-17 19-17 0 11-7 17-19 17z" fill="#8fb8a6"/>
    </g>

    <g id="cell">
      <rect width="380" height="300" rx="24" fill="#f6f1e7" stroke="#e7dfd1"/>
      <rect x="196" y="184" width="76" height="76" rx="19" fill="#fffdf8" stroke="#e7dfd1"/>
      <rect x="284" y="184" width="76" height="76" rx="19" fill="#191d20"/>
    </g>
  </defs>

  <rect width="1240" height="760" fill="#fffdf8"/>
  <text x="40" y="52" font-size="26" font-weight="800" fill="#2a2d2f">Grown logo options</text>
  <text x="40" y="78" font-size="15" fill="#5a5f63">Each is shown with the name, then as an app icon on light and on dark.</text>

  <!-- 1 -->
  <g transform="translate(40 104)">
    <use href="#cell"/>
    <g color="#2a2d2f"><use href="#m1" transform="translate(28 32) scale(1.5)"/></g>
    <text x="140" y="100" font-size="50" font-weight="800" fill="#2a2d2f" letter-spacing="-1">Grown</text>
    <g color="#2a2d2f"><use href="#m1" transform="translate(208 196) scale(.8125)"/></g>
    <g color="#eef0f1"><use href="#m1" transform="translate(296 196) scale(.8125)"/></g>
    <text x="28" y="210" font-size="19" font-weight="800" fill="#2a2d2f">1 · Seedling</text>
    <text x="28" y="234" font-size="14" fill="#5a5f63">Today's mark,</text>
    <text x="28" y="252" font-size="14" fill="#5a5f63">cleaned up.</text>
  </g>

  <!-- 2 -->
  <g transform="translate(430 104)">
    <use href="#cell"/>
    <use href="#m2" transform="translate(28 32) scale(1.5)"/>
    <text x="140" y="100" font-size="50" font-weight="800" fill="#2a2d2f" letter-spacing="-1">Grown</text>
    <use href="#m2" transform="translate(208 196) scale(.8125)"/>
    <use href="#m2" transform="translate(296 196) scale(.8125)"/>
    <text x="28" y="210" font-size="19" font-weight="800" fill="#2a2d2f">2 · Blue tile</text>
    <text x="28" y="234" font-size="14" fill="#5a5f63">Reads as an app.</text>
    <text x="28" y="252" font-size="14" fill="#5a5f63">Same on any color.</text>
  </g>

  <!-- 3 -->
  <g transform="translate(820 104)">
    <use href="#cell"/>
    <use href="#m3" transform="translate(28 32) scale(1.5)"/>
    <text x="140" y="100" font-size="50" font-weight="800" fill="#2a2d2f" letter-spacing="-1">rown</text>
    <use href="#m3" transform="translate(208 196) scale(.8125)"/>
    <use href="#m3" transform="translate(296 196) scale(.8125)"/>
    <text x="28" y="210" font-size="19" font-weight="800" fill="#2a2d2f">3 · Leaf G</text>
    <text x="28" y="234" font-size="14" fill="#5a5f63">The G grows a leaf</text>
    <text x="28" y="252" font-size="14" fill="#5a5f63">and starts the name.</text>
  </g>

  <!-- 4 -->
  <g transform="translate(40 424)">
    <use href="#cell"/>
    <g color="#2a2d2f"><use href="#m4" transform="translate(28 32) scale(1.5)"/></g>
    <text x="140" y="100" font-size="50" font-weight="800" fill="#2a2d2f" letter-spacing="-1">Grown</text>
    <g color="#2a2d2f"><use href="#m4" transform="translate(208 196) scale(.8125)"/></g>
    <g color="#eef0f1"><use href="#m4" transform="translate(296 196) scale(.8125)"/></g>
    <text x="28" y="210" font-size="19" font-weight="800" fill="#2a2d2f">4 · Paper sprout</text>
    <text x="28" y="234" font-size="14" fill="#5a5f63">Growth out of the</text>
    <text x="28" y="252" font-size="14" fill="#5a5f63">paper in your hand.</text>
  </g>

  <!-- 5 -->
  <g transform="translate(430 424)">
    <use href="#cell"/>
    <use href="#m5" transform="translate(28 32) scale(1.5)"/>
    <text x="140" y="100" font-size="50" font-weight="800" fill="#2a2d2f" letter-spacing="-1">Grown</text>
    <use href="#m5" transform="translate(208 196) scale(.8125)"/>
    <use href="#m5" transform="translate(296 196) scale(.8125)"/>
    <text x="28" y="210" font-size="19" font-weight="800" fill="#2a2d2f">5 · Breath</text>
    <text x="28" y="234" font-size="14" fill="#5a5f63">Rings like the new</text>
    <text x="28" y="252" font-size="14" fill="#5a5f63">breathing background.</text>
  </g>

  <!-- 6 -->
  <g transform="translate(820 424)">
    <use href="#cell"/>
    <g color="#2a2d2f"><use href="#m6" transform="translate(28 32) scale(1.5)"/></g>
    <text x="140" y="100" font-size="50" font-weight="800" fill="#2a2d2f" letter-spacing="-1">grown</text>
    <g color="#2a2d2f"><use href="#m6" transform="translate(208 196) scale(.8125)"/></g>
    <g color="#eef0f1"><use href="#m6" transform="translate(296 196) scale(.8125)"/></g>
    <text x="28" y="210" font-size="19" font-weight="800" fill="#2a2d2f">6 · Seed ring</text>
    <text x="28" y="234" font-size="14" fill="#5a5f63">One ring, one leaf.</text>
    <text x="28" y="252" font-size="14" fill="#5a5f63">Simplest of the six.</text>
  </g>
</svg>
