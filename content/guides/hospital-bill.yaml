id: hospital-bill
version: "0.1"
status: preview
category: health
title:
  en: "Same pattern, new paper: a hospital or clinic bill."
  es: "Mismo patrón, nuevo papel: una factura de hospital o clínica."
card:
  title:
    en: A hospital or clinic bill
    es: Una factura de hospital o clínica
  blurb:
    en: What it says you owe, who sent it, and what to check first.
    es: Qué dice que debes, quién la envió y qué revisar primero.
intro:
  en: A medical bill can be hard to read. Grown will help you understand what you're looking at before you pay.
  es: Una factura médica puede ser difícil de leer. Grown te ayudará a entender lo que tienes enfrente antes de pagar.
answers:
  - en: A bill from a hospital, a clinic, a doctor's office, or a collection agency, and how to tell them apart.
    es: Una factura de un hospital, una clínica, un consultorio o una agencia de cobranza, y cómo distinguirlas.
  - en: Which provider sent it, and which insurance plan, if any, was billed.
    es: Qué proveedor la envió y a qué seguro, si hay alguno, se le cobró.
  - en: The date of the visit, the statement date, and the due date printed on the bill.
    es: La fecha de la visita, la fecha del estado de cuenta y la fecha de pago impresa en la factura.
  - en: The total, what insurance has paid so far, and the amount the bill says is yours. Grown points to the numbers on your bill and never estimates them.
    es: El total, lo que el seguro ha pagado hasta ahora y la cantidad que la factura dice que te toca. Grown señala los números de tu factura y nunca los calcula.
  - en: Ask for an itemized bill, ask about financial help or a payment plan, or check it against your insurance paperwork.
    es: Pedir una factura detallada, preguntar por ayuda financiera o un plan de pagos, o compararla con los papeles de tu seguro.
  - en: Find the billing phone number on the bill and the account number you will need when you call.
    es: Busca en la factura el teléfono de cobros y el número de cuenta que vas a necesitar cuando llames.
